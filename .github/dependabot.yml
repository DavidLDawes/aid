version: 2
updates:

  # ── npm packages → main ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # @babel/preset-typescript 8.0.1 mis-parses generic call/instantiation
      # expressions (new Set<string>(), jest.fn<T>(), useState<T>()), and
      # @babel/core 8.0.1 breaks the still-7.x preset-typescript peer dep.
      # See PRs #218/#229/#230/#231/#233. Re-enable once babel fixes this.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]

  # ── npm packages → capital ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: capital
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # See "npm packages → main" ignore block above for why.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]

 # ── npm packages → megastructure ───────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: megastructure
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # See "npm packages → main" ignore block above for why.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-typescript"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions → main ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main

  # ── GitHub Actions → capital ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: capital

  # ── GitHub Actions → megastructure ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: megastructure

  # ── Docker base image → main ─────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ── Docker base image → capital ───────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: capital
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ── Docker base image → megastructure ───────────────────────────────────────────
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: megastructure
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
